# Config file for training SDF model

dataset: None   # Dataset used, needs to be filled in
dataset_input_numbers: [1, 2]
registered_regions_per_input: ["outer_head", "palate"]

# training
epochs: 100000
lr_model: 0.0001   # Initial learning rate (model)
lr_latent: 0.001    # Initial learning rate (latent vector)
batch_size: 4  # Was 4 originally, NPHM used 5 (not 32??)
model_grad_clip: 0.1
latent_grad_clip: 0.1
weight_decay: 0.01
# Landmark indices for the registered meshes (left-right pairs written together)
include_landmarks: [ # outer head
  [12472, 677,   18758, 7108,   23008, 11393,   17299, 5629,   13908, 2134,   20049, 8426,   23713, 12103,
  999,   7006,   2476,   2454,   2447,   2482,
  22356, 10741,   18445, 6790,   22461, 10846,   22433, 10818,   14103, 2329,   15203, 3506,
  14038, 2264,   15796, 4102,   22500, 10885,   23701, 16547,   12091, 4867,
  14065, 23686,   2291, 12076,
  3695],
  # palate
  [23665, 12055,   260, 76,   20211, 8588,   19942, 8318,   8255, 23730,
  192,   48,   17]
]
mini_net_landmark_indices: []
loss_weights:
    surface: 2
    normal: 0.3
    eikonal: 0.1
    off_surface: 0.01
    off_surface_alpha: 10
    latent_reg: 0.01
    landmarks_deform: 1
    landmarks_correspondence_pred: 7.5

# checkpoints
save_ckpt_interval: 100
num_best_checkpoints_to_keep: 10

# architecture
use_nphm_model_setting: True
lm_class_masking: True
use_sdf_correction: False
predict_correspondence_landmarks: True
correspondence_lat_dim: 128
latent_size: 256   # Size of the latent vector

# lr_scheduling
lr_scheduler: fix   # Learning rate scheduling
lr_decay_multiplier: 0.5   # Multiplier for the learning rate scheduling
lr_decay_step_size: 600   # Patience in the learning rate scheduling