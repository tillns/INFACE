# Config file for a PCA-model-based face registration

# Path to head model; we choose the PCA model here, but the autoencoder would also work
model_path: 'INFACE/pca_model.h5'

# Define the landmarks on the model as additional sparse correspondences to drive the registration.
# You can specify the weight (default 1), the respective landmark index on the target (default is entry number),
# and also the explicit coordinates or model mesh indices if the key is not an index name in the model class.
model_landmarks: {
    "columella_inner_right": {
        weight: 1.0,
        target_landmark_index: 36
    },
    "columella_inner_left": {
